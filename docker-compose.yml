# PowerShop Analytics — full stack
# Services: PostgreSQL mirror + ETL (nightly scheduler) + WrenAI (5 containers) + OTel collector
#
# Quick start (symlink to centralized credentials):
#   ln -sf ~/.config/powershop-analytics/.env .env
#   docker compose up -d
#   open http://localhost:${HOST_PORT:-3000}
#
# Or copy .env.example and fill in manually:
#   cp .env.example .env && $EDITOR .env

networks:
  wren:
    driver: bridge

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — mirror of the 4D source data
  # ---------------------------------------------------------------------------
  postgres:
    # Sin limite, macOS mata lo que le parece cuando falta memoria:
    # el ETL murio asi 104 veces sin dejar traza (ExitCode=0, sin OOMKilled).
    # Con limite, Docker mata al que se pasa y lo dice.
    mem_limit: 2g
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 1gb
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-powershop}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - wren
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-powershop}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # OTel Collector — EDOT collector (Elastic Agent in OTel collector mode)
  # Receives OTLP traces/metrics/logs from ETL + Dashboard, applies redaction
  # and tail-sampling, exports to Elastic Cloud (when ELASTIC_OTLP_ENDPOINT is
  # set) or falls back to a local JSONL file under ./otel/local/.
  # ---------------------------------------------------------------------------
  otel-collector:
    # Sin limite, macOS mata lo que le parece cuando falta memoria:
    # el ETL murio asi 104 veces sin dejar traza (ExitCode=0, sin OOMKilled).
    # Con limite, Docker mata al que se pasa y lo dice.
    mem_limit: 512m
    image: docker.elastic.co/elastic-agent/elastic-agent:8.16.0
    restart: unless-stopped
    command: ["otel", "--config", "/etc/otelcol/config.yaml"]
    environment:
      # Required: tells the Elastic Agent entrypoint to run in OTel collector
      # mode (elastic-agent otel) instead of Fleet mode (elastic-agent container).
      # Without this the health endpoint on port 13133 never binds.
      ELASTIC_AGENT_OTEL: "true"
      # Pass ELASTIC_ credentials through only when set on the host so the
      # otelcol-config.yaml fallback defaults kick in cleanly in local dev.
      ELASTIC_OTLP_ENDPOINT:
      ELASTIC_OTLP_API_KEY:
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./otel/otelcol-config.yaml:/etc/otelcol/config.yaml:ro
      - ./otel/local:/var/log/otel
      # Filelog bind-mount (Linux only): commented out so `docker compose up -d`
      # works on macOS / Docker Desktop where /var/lib/docker/containers is inside
      # a VM and the host path does not exist. On Linux, enable via the override:
      #   docker compose -f docker-compose.yml -f docker-compose.linux.yml up -d
      # The filelog receiver in otelcol-config.yaml is always compiled in; without
      # this mount it simply idles (no files to tail) — no errors, no crash.
    expose:
      - "4317"   # OTLP gRPC
      - "4318"   # OTLP HTTP
      - "13133"  # health_check extension
    networks:
      - wren
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:13133/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # ETL — extracts data from 4D and loads into PostgreSQL
  # Runs in scheduler mode by default (daily at ETL_CRON_HOUR, default 02:00).
  # For a one-off sync: docker compose run --rm etl python main.py --once
  # ---------------------------------------------------------------------------
  etl:
    # Sin limite, macOS mata lo que le parece cuando falta memoria:
    # el ETL murio asi 104 veces sin dejar traza (ExitCode=0, sin OOMKilled).
    # Con limite, Docker mata al que se pasa y lo dice.
    mem_limit: 2g
    build: ./etl
    restart: unless-stopped
    environment:
      P4D_HOST: ${P4D_HOST:-}
      P4D_PORT: ${P4D_PORT:-19812}
      P4D_USER: ${P4D_USER:-}
      P4D_PASSWORD: ${P4D_PASSWORD:-}
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/${POSTGRES_DB:-powershop}
      ETL_CRON_HOUR: ${ETL_CRON_HOUR:-2}
      # CONFIG_FILE pins the config path to the host-mounted /config directory.
      # Without it the loader would fall back to ~/.config/powershop-analytics/config.yaml
      # (inside the container) which does not exist.
      CONFIG_FILE: /config/config.yaml
      CONFIG_SCHEMA_PATH: /app/config/schema.yaml
      # OTel SDK env vars — picked up automatically by opentelemetry-instrument (Phase 2)
      OTEL_SERVICE_NAME: powershop-etl
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${ENVIRONMENT:-development}
      # Python logging -> OTLP logs, so ETL log lines reach the collector and
      # not just container stdout.
      OTEL_LOGS_EXPORTER: otlp
      OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      # Sampling moved from the collector's tail_sampling processor (removed,
      # see otel/otelcol-config.yaml) to SDK head sampling. Default 10% —
      # parentbased_always_on would ship every trace unsampled now that
      # nothing downstream trims volume. Override to *_always_on / arg 1.0
      # for a debugging session where you want every trace kept.
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      # Mount centralized config directory (read-only; ETL only reads config)
      - ${POWERSHOP_CONFIG_DIR:-${HOME}/.config/powershop-analytics}:/config:ro
      # Mount schema so the container can validate/read key definitions
      - ./config/schema.yaml:/app/config/schema.yaml:ro
    networks:
      - wren
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Dashboard App — AI-generated dashboards (Next.js + Tremor, port 4000)
  # ---------------------------------------------------------------------------
  dashboard:
    # Sin limite, macOS mata lo que le parece cuando falta memoria:
    # el ETL murio asi 104 veces sin dejar traza (ExitCode=0, sin OOMKilled).
    # Con limite, Docker mata al que se pasa y lo dice.
    mem_limit: 2g
    build:
      context: ./dashboard
      args:
        # Set automatically by `ps stack` when .git exists; override for CI (e.g. git describe --tags --always --dirty)
        APP_GIT_DESCRIBE: ${APP_GIT_DESCRIBE:-}
    restart: unless-stopped
    environment:
      # Node deriva su heap del mem_limit del contenedor: con 1g eran 524 MB,
      # y el flujo agentico de free-chat los agotaba. 13 reinicios y dos
      # conversaciones perdidas el 2026-08-31, cada proceso muriendo a los
      # 12-30 s con 'Reached heap limit'. Explicito para que el tope sea una
      # decision y no un efecto secundario del limite del contenedor.
      NODE_OPTIONS: ${DASHBOARD_NODE_OPTIONS:---max-old-space-size=1536}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-powershop}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-}
      # CONFIG_FILE pins the config path to the host-mounted /config directory.
      # Without it the loader would fall back to ~/.config/powershop-analytics/config.yaml
      # (inside the container) which does not exist.
      CONFIG_FILE: /config/config.yaml
      CONFIG_SCHEMA_PATH: /app/config/schema.yaml
      # DASHBOARD_LLM_PROVIDER / DASHBOARD_LLM_MODEL_* / DASHBOARD_LLM_CLI_*
      # intentionally NOT set here — the values come from config.yaml
      # (D-023 precedence: env > config.yaml > default). Setting a default
      # here would silently override the operator's config.yaml choice and
      # block editing from the admin /config UI (env-sourced keys are
      # surfaced as read-only). Set them on the host shell only if you
      # genuinely want a hard override.
      # Claude Code CLI credentials for DASHBOARD_LLM_PROVIDER=cli.
      # Run `claude /install-github-app` once to generate a 1-year OAuth token.
      # Copy the full contents of ~/.claude/.credentials.json into your
      # ~/.config/powershop-analytics/.env as CLAUDE_CODE_OAUTH_TOKEN='<json>'.
      # The CLI reads this env var directly — no file mount needed (D-025 updated).
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      HOME: /home/nextjs
      # OTel SDK env vars — picked up automatically by the Node SDK (Phase 3)
      OTEL_SERVICE_NAME: powershop-dashboard
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${ENVIRONMENT:-development}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      # Sampling moved from the collector's tail_sampling processor (removed,
      # see otel/otelcol-config.yaml) to SDK head sampling. Default 10% —
      # parentbased_always_on would ship every trace unsampled now that
      # nothing downstream trims volume. Override to *_always_on / arg 1.0
      # for a debugging session where you want every trace kept.
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Git SHA baked at build time; available to the OTel resource as service.version
      NEXT_PUBLIC_GIT_SHA: ${APP_GIT_DESCRIBE:-}
      # Conversation context logs (the exact payload sent to the LLM per turn) are
      # written to files under this dir; the DB stores only the pointer. The dir is
      # a bind-mounted volume (below) so the logs survive container recreation.
      DASHBOARD_CONTEXT_DIR: /app/data/conversations
    volumes:
      # Mount centralized config directory (read-write; dashboard writes config.yaml)
      - ${POWERSHOP_CONFIG_DIR:-${HOME}/.config/powershop-analytics}:/config:rw
      # Mount schema so the container can validate/read key definitions
      - ./config/schema.yaml:/app/config/schema.yaml:ro
      # Mount the canonical PostgreSQL DDL so the dashboard's Next.js
      # instrumentation hook can apply pending migrations on startup
      # (idempotent — CREATE TABLE IF NOT EXISTS). Both ETL and Dashboard
      # apply the same file; init.sql is the single source of schema truth.
      - ./etl/schema/init.sql:/app/schema/init.sql:ro
      # Per-turn conversation context logs (D-002 bind mount; survives restarts).
      - ./data/dashboard/conversations:/app/data/conversations:rw
      # Note: CLAUDE_CODE_OAUTH_TOKEN is passed via env (above). No file mount needed.
    ports:
      - "${DASHBOARD_PORT:-4000}:4000"
    networks:
      - wren
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health | grep -qF '\"status\":\"ok\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
