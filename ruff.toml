# Ruff configuration for the Python trees (etl/, scripts/).
#
# `select` is pinned deliberately. CI installs ruff unpinned (`pip install
# ruff`), and ruff's DEFAULT rule set widens between releases — so a release
# made on ruff's side, with no commit here, turned `ruff check etl/` red on
# main with 78 findings across BLE001, S110, DTZ001, RUF059, FURB, TRY and
# others. Nothing in the code had changed; the linter's opinion had.
#
# These four are ruff's own documented default (E4, E7, E9, F), which this
# codebase passes cleanly today. Writing them down converts an implicit,
# externally-versioned default into an explicit repo decision, so the next
# ruff release cannot re-break CI on its own.
#
# Widening the set is a fine thing to do — several of those findings are worth
# fixing — but it should be a commit someone makes on purpose, with the code
# changes alongside it, not a surprise on an unrelated PR.
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F"]
