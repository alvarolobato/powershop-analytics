# PowerShop Analytics — production stack
# Uses pre-built Docker Hub images. No local build required.
#
# Quick install:
#   curl -fsSL https://raw.githubusercontent.com/alvarolobato/powershop-analytics/main/deploy/install.sh | bash
#
# Manual install:
#   mkdir ~/powershop && cd ~/powershop
#   curl -LO https://github.com/alvarolobato/powershop-analytics/releases/latest/download/docker-compose.prod.yml
#   mv docker-compose.prod.yml docker-compose.yml
#   curl -LO https://github.com/alvarolobato/powershop-analytics/releases/latest/download/wren-config.yaml
#   cp /path/to/.env.example .env && $EDITOR .env
#   mkdir -p ~/.config/powershop-analytics
#   docker compose up -d
#
# Data directories (auto-created, survive restarts):
#   ./data/postgres   — PostgreSQL data
#   ./data/qdrant     — Qdrant vector store
#   ./data/wren       — WrenAI config/state/SQLite
#
# Dashboard config (settings saved via /admin/config UI):
#   ~/.config/powershop-analytics/config.yaml  — persisted dashboard settings

# Log rotation. Docker's default json-file driver is UNBOUNDED, and this stack
# had no logging config at all: qdrant reached 961 MB, wren-ai-service 636 MB and
# etl 235 MB, none of it ever reclaimed. Two of those were symptoms of bugs fixed
# in this same change, but the absence of a cap is the reason they could grow
# until someone went looking. Anchored here and applied to every service below so
# a new service cannot be added without one.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

networks:
  wren:
    driver: bridge

services:

  # ---------------------------------------------------------------------------
  # OpenTelemetry collector — ships traces/metrics/logs to Elastic Cloud.
  #
  # The apps export OTLP here rather than straight to Elastic on purpose: the
  # collector's `attributes/redact` processor strips authorization headers and
  # openrouter.api_key from telemetry before it leaves the host. Exporting
  # direct from each service would drop that scrubbing.
  #
  # Note on log coverage: the filelog receiver that tails container stdout
  # needs /var/lib/docker/containers, which does not exist on macOS — Docker
  # Desktop keeps it inside its VM. This host is a Mac, so filelog idles here
  # (no files to tail, no error) and what reaches Elastic is APPLICATION
  # telemetry over OTLP, not the stdout of postgres/wren-*. Those stay local
  # under the json-file rotation configured above.
  #
  # ELASTIC_OTLP_* come from .env. When unset the exporter falls back to a
  # refused endpoint and drops silently, so a missing credential degrades to
  # no telemetry rather than a crash-loop — this stack has been taken down by
  # a collector that could not start before (D-042).
  otel-collector:
    # Sin limite, macOS mata lo que le parece cuando falta memoria:
    # el ETL murio asi 104 veces sin dejar traza (ExitCode=0, sin OOMKilled).
    # Con limite, Docker mata al que se pasa y lo dice.
    mem_limit: 512m
    image: docker.elastic.co/elastic-agent/elastic-agent:${ELASTIC_AGENT_VERSION:-8.16.0}
    restart: unless-stopped
    command: ["otel", "--config", "/etc/otelcol/config.yaml"]
    environment:
      # Runs the image in OTel-collector mode rather than Fleet mode; without
      # it the health endpoint on 13133 never binds.
      ELASTIC_AGENT_OTEL: "true"
      ELASTIC_OTLP_ENDPOINT:
      ELASTIC_OTLP_API_KEY:
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes:
      - ./otel/otelcol-config.yaml:/etc/otelcol/config.yaml:ro
      - ./otel/local:/var/log/otel
    expose:
      - "4317"
      - "4318"
      - "13133"
    logging: *default-logging
    networks:
      - wren
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:13133/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # PostgreSQL — mirror of the 4D source data
  # pg_stat_statements required for /admin/slow-queries
  # ---------------------------------------------------------------------------
  postgres:
    # Sin limite, macOS mata lo que le parece cuando falta memoria:
    # el ETL murio asi 104 veces sin dejar traza (ExitCode=0, sin OOMKilled).
    # Con limite, Docker mata al que se pasa y lo dice.
    mem_limit: 2g
    image: postgres:16-alpine
    # Default Docker /dev/shm is 64 MB; parallel-query workers (heavy home /
    # dashboard aggregations) exhaust it and fail with "could not resize shared
    # memory segment ... No space left on device". Must stay in sync with the
    # dev docker-compose.yml. Do NOT drop this — `ps prod update` overwrites the
    # prod compose from this file, so a missing line silently breaks production.
    shm_size: 1gb
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-powershop}
    ports:
      - "${HOST_BIND:-0.0.0.0}:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    logging: *default-logging
    networks:
      - wren
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-powershop}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # ETL — extracts data from 4D and loads into PostgreSQL
  # Scheduler mode: nightly full sync at ETL_CRON_HOUR (default 02:00 UTC)
  #                 + hourly delta sync.
  # One-off sync:   docker compose run --rm etl python -m etl.main --once
  # ---------------------------------------------------------------------------
  etl:
    # Sin limite, macOS mata lo que le parece cuando falta memoria:
    # el ETL murio asi 104 veces sin dejar traza (ExitCode=0, sin OOMKilled).
    # Con limite, Docker mata al que se pasa y lo dice.
    mem_limit: 2g
    image: ${DOCKERHUB_NAMESPACE:-alobato}/powershop-etl:${ETL_VERSION:-latest}
    restart: unless-stopped
    environment:
      P4D_HOST: ${P4D_HOST:-}
      P4D_PORT: ${P4D_PORT:-19812}
      P4D_USER: ${P4D_USER:-}
      P4D_PASSWORD: ${P4D_PASSWORD:-}
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/${POSTGRES_DB:-powershop}
      ETL_CRON_HOUR: ${ETL_CRON_HOUR:-2}
      # The image runs under `opentelemetry-instrument`. It used to export to
      # the default localhost:4317 with no collector in the stack, which
      # produced 381,000 of this container's 398,000 log lines as failed
      # exports — ~95% of the volume, burying the sync errors you actually
      # need to read. A collector now exists (see otel-collector above), so
      # the SDK is enabled and pointed at it instead of disabled.
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_SERVICE_NAME: powershop-etl
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${ENVIRONMENT:-production}
      # Python logging -> OTLP logs, so ETL log lines reach Elastic and not
      # just container stdout (which has no shipper on this host).
      OTEL_LOGS_EXPORTER: otlp
      OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
    logging: *default-logging
    networks:
      - wren
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Dashboard App — AI-generated dashboards (Next.js + Tremor, port 4000)
  # ---------------------------------------------------------------------------
  dashboard:
    # Sin limite, macOS mata lo que le parece cuando falta memoria:
    # el ETL murio asi 104 veces sin dejar traza (ExitCode=0, sin OOMKilled).
    # Con limite, Docker mata al que se pasa y lo dice.
    mem_limit: 1g
    image: ${DOCKERHUB_NAMESPACE:-alobato}/powershop-dashboard:${DASHBOARD_VERSION:-latest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-powershop}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Required, not defaulted. This key gates the admin surfaces —
      # /admin/*, /etl*, /api/admin/* and /api/etl/* (see dashboard/middleware.ts).
      # Production binds 0.0.0.0 (LAN-reachable, see the port mapping below),
      # and the middleware fails closed, so a deployment with no key set still
      # starts — it just serves 503 "admin_not_configured" on every admin route
      # until somebody tries to use one and notices. A forgotten key is an
      # avoidably broken deployment rather than a caught one, so refuse the
      # `docker compose up` instead.
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY in .env — this instance is reachable from outside the host}
      # Set true when the dashboard is served over HTTPS (behind TLS termination).
      # Leave unset on plain HTTP (e.g. LAN access by IP) so the cookie is stored.
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-}
      # Public URLs for reverse-proxy / custom domain deployments.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:4000}
      WREN_PUBLIC_URL: ${WREN_PUBLIC_URL:-http://localhost:3000}
      # config.yaml location — points to the host-mounted persistent directory.
      CONFIG_FILE: /config/config.yaml
      # Per-turn context logs (D-040). Without this the loader falls back to
      # /app/data/conversations, which does not exist and cannot be created:
      # the container runs as uid 1001 and /app is root-owned, so every write
      # failed with `EACCES: permission denied, mkdir '/app/data'`. The writes
      # are best-effort, so nothing surfaced — "Contexto original" was simply
      # always empty in production. This was set in docker-compose.yml and
      # never added here.
      DASHBOARD_CONTEXT_DIR: /app/data/conversations
      # Telemetry. service.name is set explicitly rather than left to the SDK
      # default (`unknown_service:node`), which would make the dashboard
      # indistinguishable from anything else in Elastic.
      OTEL_SERVICE_NAME: powershop-dashboard
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${ENVIRONMENT:-production}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Credentials for DASHBOARD_LLM_PROVIDER=cli. Present in docker-compose.yml
      # but never here, so switching the provider to `cli` from /admin/config —
      # a one-click change in the UI — would have failed to authenticate with no
      # hint why. Prod runs OpenRouter today; these make the other setting work
      # rather than fail obscurely. Empty default: harmless when unused.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      HOME: /home/nextjs
      # LLM settings (provider, model, etc.) intentionally NOT set as env vars
      # here — configure them via /admin/config so the UI can edit them.
      # Env-sourced keys render read-only in the config UI.
    volumes:
      # CRITICAL: :rw — the dashboard writes config.yaml when settings are saved
      # via /admin/config. Without :rw all changes are lost on container restart.
      - ${POWERSHOP_CONFIG_DIR:-${HOME}/.config/powershop-analytics}:/config:rw
      # Backs DASHBOARD_CONTEXT_DIR above. Must be writable by uid 1001.
      - ./data/dashboard/conversations:/app/data/conversations:rw
    ports:
      - "${HOST_BIND:-0.0.0.0}:${DASHBOARD_PORT:-4000}:4000"
    logging: *default-logging
    networks:
      - wren
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
